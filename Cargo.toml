[workspace]
resolver = "2"
members = ["crates/zgfx-core", "crates/zgfx"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
zgfx-core = { path = "crates/zgfx-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Vulkan bindings, loader opened at run time (dlopen), so a device without Vulkan still runs zgfx.
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
# 0.8: 0.9 needs Rust 1.88, above this workspace's MSRV; ash itself depends on 0.8.
libloading = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
